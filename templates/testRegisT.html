<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <style>
        /* The existing design remains unchanged */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff7f50, #ffb74d);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .login-container {
            z-index: 4;
            position: relative;
            background-color: #ff8533;
            padding: 20px;
            border-radius: 15px;
            width: 500px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 2px solid black;
        }

        .login-container h2 {
            color: #fff;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-column {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .login-container label {
            text-align: left;
            color: #fff;
            margin-top: 10px;
        }

        .login-container input, .login-container select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
            background-color: #3e2723;
            color: #fff;
        }

        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #ff4500;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-container button:hover {
            background-color: #ff652f;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="login-container">
        <h2>Register</h2>
        <form onsubmit="event.preventDefault(); redirectToIndex();">
            <div class="form-row">
                <div class="form-column">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your Name" required>
                </div>
                <div class="form-column">
                    <label for="surname">Surname</label>
                    <input type="text" id="surname" placeholder="Enter your Surname" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-column">
                    <label for="national-id">National ID</label>
                    <input type="text" id="national-id" placeholder="Enter your National ID" required>
                </div>
                <div class="form-column">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="username@kmitl.ac.th" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-column">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="form-column">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm Password" required>
                </div>
            </div>

            <label for="subject">Subject</label>
            <select id="subject" required>
                <option value="" disabled selected>Select your subject</option>
                <option value="subject1">FEEDBACK CONTROL</option>
                <option value="subject2">INTRODUCTION TO ALGORITHMS</option>
                <option value="subject3">ADVANCED COMPUTER PROGRAMMING FOR RAI</option>
            </select>

            <button type="submit">Register</button>
        </form>
    </div>
</div>

<script>
    function redirectToIndex() {
        window.location.href = '/alreadyregis';
    }
</script>

</body>
</html>
