<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', serif;
            background: linear-gradient(to bottom right, #ff5400, #dacc07 , #ac2f2f);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background-color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid #e6e6e6;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeIn 1s forwards ease-in-out;
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .container h1 {
            font-size: 38px;
            font-weight: 400;
            margin-bottom: 30px;
            color: #333;
        }
        .container img {
            width: 280px;
            height: 280px;
            margin-top: 20px;
            transition: transform 0.4s ease-in-out;
        }
        .container img:hover {
            transform: scale(1.08);
        }
        .container p {
            font-size: 25px;
            font-weight: 300;
            color: #555;
            margin-top: 25px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInText 1.5s forwards ease-in-out;
            animation-delay: 0.5s;
        }
        @keyframes fadeInText {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login in</h1>
        <img src="/static/A_simple_flat_orange_checkmark_symbol_inside_a_cir-removebg-preview.png" alt="Orange check mark">
        <p>You are already registered.</p>
    </div>
</body>
</html>
