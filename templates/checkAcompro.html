<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance compro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: linear-gradient(90deg, rgba(255,165,0,1) 0%, rgba(255,99,71,1) 50%, rgba(255,140,0,1) 100%);
            color: #333; /* Darker text color for general body */
        }
        h1 {
            text-align: center;
            color: #fff; /* White title for contrast */
            font-size: 48px; /* Increased font size for the title */
            padding: 20px;
            background-color: #ff7f50; /* Background for the title */
            border: 5px solid #ba3800; /* Add orange border around the title */
            border-radius: 10px; /* Softened corners */
            width: fit-content;
            margin: 20px auto; /* Center the title */
        }
        .diagram {
            text-align: center;
            margin-bottom: 20px;
        }
        .table-container {
            display: flex;
            justify-content: center;
            overflow-y: scroll;
            height: 400px; /* Makes the table scrollable */
            border: 1px solid #fff;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 16px; /* Increased font size */
            background-color: #fff; /* Solid white background for the table for higher contrast */
            color: #333; /* Darker text color for better readability */
        }
        th, td {
            border: 2px solid #ccc; /* Thicker, lighter borders for more definition */
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #ff7f50; /* A distinct orange background for the header */
            color: #fff; /* White text for headers */
        }
        /* Zebra striping effect */
        tbody tr:nth-child(odd) {
            background-color: #f2f2f2; /* Light gray background for odd rows */
        }
        tbody tr:nth-child(even) {
            background-color: #e6e6e6; /* Slightly darker gray for even rows */
        }
        /* Back button styling */
        .back-button {
            display: block;
            width: 100px;
            padding: 10px;
            text-align: center;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            margin: 20px auto;
            border-radius: 5px;
        }
        .back-button:hover {
            background-color: #45a049;
        }
    </style>
</head>

</html>
