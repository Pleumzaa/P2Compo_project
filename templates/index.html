<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #d35400;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            display: flex;
            background-color: #e67e22;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .login-box {
            padding: 40px;
            background: #f39c12;
            color: black;
            width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-box h1 {
            margin-bottom: 36px;
            font-size: 30px;
            color: black;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
            color: black;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            background-color: #4b2d29;
            color: black;
        }
        .input-group input::placeholder {
            color: #ddd;
        }
        button {
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e67900;
        }
        .signup-text {
            margin-top: 22px;
            color: black;
            font-size: 16px;
        }
        .signup-text a {
            color: #;
            text-decoration: none;
        }
        .signup-text a:hover {
            text-decoration: underline;
        }
        .image-section {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #fbe1ce;
        }
        .image-section img {
            width: 350px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Login</h1>
            <form>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit">Sign in</button>
            </form>
            <p class="signup-text">
                Don't have an account? <a href="role">Create an account</a>
            </p>
        </div>
        <div class="image-section">
            <img src="static/students.png" alt="Students Image">
        </div>
    </div>
</body>
</html>
